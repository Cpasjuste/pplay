name: Build PS4 pkg

on:
  workflow_dispatch:
  push:
    branches: [ master, main, ps4-fixes ]

permissions:
  contents: write

jobs:
  orbis-decoder-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test h264_orbis against a libSceVideodec2 mock
        run: |
          set -e
          sudo apt-get -yq update
          sudo apt-get -yq install ffmpeg libx264-dev build-essential zlib1g-dev libbz2-dev xz-utils curl
          ./ffmpeg-orbis/test/run.sh
          ./tests/subtitles/run.sh
          ./tests/menu/run.sh
          ./tests/subpref/run.sh
          ./tests/remote/run.sh

  ps4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pacman and PS4 toolchain (OpenOrbis via PacBrew)
        run: |
          set +e
          (
            set -e
            sudo apt-get -yq update
            sudo apt-get -yq install pacman-package-manager makepkg libarchive-tools build-essential \
              autoconf libtool cmake nasm git curl python3 zip
            # new PacBrew package server (see PacBrew/pacbrew-packages README)
            printf '\n[pacbrew]\nSigLevel = Optional TrustAll\nServer = https://pacman.mydedibox.fr/pacbrew/packages/\n' | sudo tee -a /etc/pacman.conf
            sudo pacman -Sy
            sudo pacman -S --noconfirm ps4-openorbis ps4-openorbis-portlibs
            ls /opt/pacbrew/ps4/openorbis
          ) > toolchain.log 2>&1
          rc=$?
          cat toolchain.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 25 toolchain.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=toolchain install failed (rc=$rc)::$msg"
            exit $rc
          fi

      - name: Rebuild FFmpeg with the PS4 hardware H.264 decoder (h264_orbis)
        run: |
          set +e
          (
            set -e
            ./ffmpeg-orbis/build-ffmpeg.sh
          ) > ffmpeg.log 2>&1
          rc=$?
          tail -n 40 ffmpeg.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -n -m 12 -E "error|Error|ERROR|not found|failed" ffmpeg.log; echo ...; tail -n 8 ffmpeg.log) | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=ffmpeg (h264_orbis) build failed (rc=$rc)::$msg"
            exit $rc
          fi

      - name: Create pscrap tmdb.key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # pscrap/CMakeLists.txt requires tmdb.key. Without a real key the app builds
          # and runs, only the TMDB scrapper (covers/synopsis) returns nothing.
          if [ -n "$TMDB_API_KEY" ]; then printf '%s' "$TMDB_API_KEY" > pscrap/tmdb.key; else printf '%s' 00000000000000000000000000000000 > pscrap/tmdb.key; fi

      - name: Build
        run: |
          set +e
          (
            set -e
            mkdir cmake-build-ps4 && cd cmake-build-ps4
            export OPENORBIS=/opt/pacbrew/ps4/openorbis
            cmake -G "Unix Makefiles" -DPLATFORM_PS4=ON -DCMAKE_BUILD_TYPE=Release ../
            make -j4 pplay_ps4_release
          ) > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            # first errors are the useful ones; keep the annotation small
            msg=$( (grep -n -m 12 -E "error|Error|CMake Error|undefined reference|No rule|not found" build.log; echo ...; tail -n 8 build.log) | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build failed (rc=$rc)::$msg"
            exit $rc
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pplay-ps4
          path: |
            cmake-build-ps4/*.zip
            cmake-build-ps4/*.pkg
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="ps4-build-${{ github.run_number }}"
          cd cmake-build-ps4
          unzip -l pplay-*.zip | tail -n 25
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "pplay PS4 build #${{ github.run_number }}" \
            --notes "Unofficial PS4 build with fixes (Network non-blocking, long menu scrolling, Options removed on PS4) and PS4 hardware H.264 decoding (HWDEC option in pplay.cfg, see ffmpeg-orbis/README.md). Install the .pkg and copy the data folder from the zip to /data/pplay/ on the console." \
            pplay-*.zip *.pkg
